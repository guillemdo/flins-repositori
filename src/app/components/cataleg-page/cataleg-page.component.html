<div class="cataleg-page">
  <header class="page-header">
    <h1>Catàleg de Flins</h1>
    <p class="subtitle">Unitat 4. Navegació</p>
  </header>

  <div class="estat-carregant" *ngIf="elementService.estat() === 'carregant'">
    <div class="spinner"></div>
    <p>Carregant elements...</p>
  </div>

  <div class="estat-error" *ngIf="elementService.estat() === 'error'">
    <div class="error-icon">⚠️</div>
    <h2>Error al carregar elements</h2>
    <p class="error-missatge">{{ elementService.error() }}</p>
    <button class="btn-reintentar" (click)="reintentar()">
      Reintentar
    </button>
  </div>

  <div class="estat-exit" *ngIf="elementService.estat() === 'exit'">
    <div class="sense-resultats" *ngIf="elementService.elements().length === 0">
      <p>No s'han trobat elements</p>
    </div>

    <cdk-virtual-scroll-viewport [itemSize]="itemSize" class="elements-viewport" *ngIf="elementService.elements().length > 0">
      <div class="fila-elements" *cdkVirtualFor="let fila of filesVirtuals(); trackBy: trackByFila">
        <div class="element-card" *ngFor="let element of fila; trackBy: trackByElement" (click)="anarADetall(element.id)" role="button" tabindex="0" (keydown.enter)="anarADetall(element.id)" [attr.aria-label]="'Veure detall de ' + element.nom">
          <img [src]="element.imatge" [alt]="element.nom" class="element-imatge">
          <button class="btn-preferit" [class.actiu]="preferitsService.esPreferit(element.id)" (click)="togglePreferit($event, element)">{{ preferitsService.esPreferit(element.id) ? '★' : '☆' }}</button>
          <div class="element-info">
            <h3 class="element-nom">{{ element.nom }}</h3>
            <p class="element-categoria">{{ element.categoria }}</p>
            <div class="descripcio-fila">
              <p class="element-descripcio">{{ element.descripcio }}</p>
              <p class="element-valoracio" *ngIf="element.valoracio !== undefined && element.valoracio !== null">
                <span class="valoracio-icona">★</span>
                {{ element.valoracio | number:'1.1-1' }}
                <span class="valoracio-max">/ 5</span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </cdk-virtual-scroll-viewport>
  </div>

  <div class="estat-inicial" *ngIf="elementService.estat() === 'inicial'">
    <p>Inicialitzant...</p>
  </div>
</div>
